<!-- DOCTYPE - Serve para informa ao navegador que estamos usado -->
!DOCTYPE html>

<!-- HTML-É tag pricinpal da pagina. Tudo relacionado ao 
 HTMLfica debtro dela -->
<html lang="pt-br">

<!-- lang/language = É um atributo e serve para configurar/
 informar o idioma da pagina. por padrão, vem configurado como em
 (Englis), mas pode ser configurado para o idioma de quem está
 escrevendo o documento HTML -->

 <!-- head/cabeça do documento - essa área é responsável por
  guardar informações sobre a pagina. chamamos de área invisivel,
  pois somente algumas informações -->
<head>
    <!-- Essa metatag serve para informar ao navegador qual 
     conjunto de caracteres a pagina utiliza. Isso garante compatibilidade
    entre mais antigos, aém de exibir da forma correta palavras acentos e caracteres
    especiais. -->
    <meta charset="UTF-8">
    

    <!-- Essa configuração serve para ajuda o navegador
     deve ser exibida de acordo como o tamanho da tela.
     Em difere -->
    <meta name="viewport" content="width=device-width,
     initial-scale=1.0">


<!-- title/titulo - Serve para definir o titulo da pagina
 que aparce, por exemplo na aba navegador -->
    <title>Olá mundo</title>
</head>

<body>
    
    Ola mundo. este e o meu primeiro progra em HTML5.

</body>

</html>
